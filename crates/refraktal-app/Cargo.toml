[package]
name = "refraktal"
description = "Open-source pattern-based music studio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "refraktal"
path = "src/lib.rs"

[[bin]]
name = "refraktal"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
assert_no_alloc = "1.1.2"
cpal = "0.18.2"
png = "0.18.1"
pollster = "1.0.1"
refraktal-dsp.workspace = true
refraktal-engine.workspace = true
refraktal-io.workspace = true
refraktal-ui.workspace = true
wgpu = "30"
winit = "0.30.13"

# Native file dialogs exist on desktop only.
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.17.2"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", features = ["android-native-activity"] }
# Saving to Downloads and sharing go through Android's Java APIs.
jni = "0.21.1"
ndk-context = "0.1.1"

# Lets the tests type-check the Android file code on any platform.
[dev-dependencies]
jni = "0.21.1"
