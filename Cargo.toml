[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
refraktal-dsp = { path = "crates/refraktal-dsp" }
refraktal-engine = { path = "crates/refraktal-engine" }

[profile.dev]
# Audio code is too slow unoptimized; keep debug info but optimize.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
