[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.87"

[workspace.dependencies]
refraktal-dsp = { path = "crates/refraktal-dsp" }
refraktal-engine = { path = "crates/refraktal-engine" }
refraktal-ui = { path = "crates/refraktal-ui" }
refraktal-io = { path = "crates/refraktal-io" }
refraktal = { path = "crates/refraktal-app" }

[profile.dev]
# Audio code is too slow unoptimized; keep debug info but optimize.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
# No debug info or symbol tables in shipped binaries: smaller, and they
# carry no build-machine paths.
debug = false
strip = true
