# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run with: cargo deny check

[advisories]
version = 2

[licenses]
version = 2
# Every license here must be compatible with GPL-3.0-or-later.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
