# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run with: cargo deny check

[advisories]
version = 2
ignore = [
    # ttf-parser is unmaintained (not a known vulnerability). It reaches us via
    # ab_glyph (our text) and winit's Linux window decorations. Revisit when
    # ab_glyph moves to skrifa or we switch text crates.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, no vulnerability; pulled in by ab_glyph and winit" },
]

[licenses]
version = 2
# Every license here must be compatible with GPL-3.0-or-later.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # Symphonia (audio decoding). MPL-2.0 is compatible with the GPL.
    "MPL-2.0",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Our own crates depend on each other by path, which cargo-deny counts as a
# wildcard version. Warn instead of failing.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
